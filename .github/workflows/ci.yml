name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Go (compiled core is a dev dependency)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify
        run: scripts/verify full
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: stash-curator-plugin
          path: |
            dist/stash-curator.zip
            dist/index.yml

  core:
    name: Compiled core (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum
      - name: Vet and test
        working-directory: core
        run: |
          go vet ./...
          go test ./...
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Differential gate (binary vs numpy)
        run: scripts/verify core

  integration:
    name: Integration (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group integration
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
      - name: Build plugin
        run: uv run --frozen python scripts/build_plugin.py
      - name: Run integration tests
        run: scripts/verify integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-artifacts
          path: /tmp/stash-curator-integration-test-output/
