name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The plugin runtime is the compiled Go core; Python exists only as the
  # test harness and differential oracle, so a single interpreter leg is
  # sufficient (the differential gates compare behavior, not Python versions).
  quality:
    name: Quality (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Install Go (compiled core is a dev dependency)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum
      - name: Install zig (C cross-compiler for the sqlite driver)
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -C "$HOME" -xf /tmp/zig.tar.xz
          echo "$HOME/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Cache Go and zig build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/zig
          key: build-${{ runner.os }}-${{ hashFiles('core/go.mod', 'core/go.sum') }}-${{ hashFiles('core/*.go') }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify
        run: scripts/verify full
      - uses: actions/upload-artifact@v7
        with:
          name: stash-curator-plugin
          path: |
            dist/stash-curator.zip
            dist/index.yml

  core:
    name: Compiled core (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum
      - name: Vet and test
        working-directory: core
        run: |
          go vet ./...
          go test ./...
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Differential gate (binary vs numpy)
        run: scripts/verify core

  integration:
    name: Integration (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    # A green run takes ~9.5 minutes, so a 10 minute cap left no headroom and
    # any variance in the browser install cancelled the whole job mid-step.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: true
      - name: Install Go (plugin packaging builds the compiled core)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum
      - name: Install zig (C cross-compiler for the sqlite driver)
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -C "$HOME" -xf /tmp/zig.tar.xz
          echo "$HOME/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Cache Go and zig build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/zig
          key: build-${{ runner.os }}-${{ hashFiles('core/go.mod', 'core/go.sum') }}-${{ hashFiles('core/*.go') }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync --locked --group integration
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # Split from the browser download so a cache hit still gets the system
      # libraries, and so the apt half carries its own timeout and retry: the
      # hang that cancelled this job was apt-get stalling on an Ubuntu mirror,
      # not the browser download.
      - name: Install Playwright system dependencies
        timeout-minutes: 12
        run: |
          # Per-attempt timeout, not just a step timeout: the observed failure
          # was apt-get hanging on a mirror, and a step-level timeout would
          # cancel the step outright rather than letting the retry fire.
          for attempt in 1 2 3; do
            if timeout 180 uv run playwright install-deps chromium; then
              exit 0
            fi
            echo "playwright install-deps failed or hung (attempt $attempt); retrying"
            sleep 15
          done
          echo "playwright install-deps failed after 3 attempts" >&2
          exit 1
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 240 uv run playwright install chromium; then
              exit 0
            fi
            echo "playwright install failed or hung (attempt $attempt); retrying"
            sleep 15
          done
          echo "playwright install failed after 3 attempts" >&2
          exit 1
      - name: Build plugin
        run: uv run --frozen python scripts/build_plugin.py
      - name: Run integration tests
        run: scripts/verify integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-artifacts
          path: /tmp/stash-curator-integration-test-output/
