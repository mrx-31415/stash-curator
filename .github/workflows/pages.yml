name: Documentation and plugin source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install Go (plugin packaging builds the compiled core)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum
      - name: Install zig (C cross-compiler for the sqlite driver)
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -C "$HOME" -xf /tmp/zig.tar.xz
          echo "$HOME/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Cache Go and zig build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/zig
          key: build-${{ runner.os }}-${{ hashFiles('core/go.mod', 'core/go.sum') }}-${{ hashFiles('core/*.go') }}
          restore-keys: |
            build-${{ runner.os }}-
      - uses: actions/configure-pages@v6
      - run: uv run --frozen python scripts/build_plugin.py
      - run: cp dist/stash-curator.zip dist/index.yml docs/
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
