name: Stash Curator
description: Navigate your library, guided by your taste.
# version is injected from pyproject.toml by scripts/build_plugin.py at build time.
version: 0.1.0
url: https://github.com/mrx-31415/stash-curator

exec:
  - python
  - "{pluginDir}/launcher.py"
  - "{pluginDir}"
interface: raw
errLog: info

ui:
  javascript:
    - stash-curator.js
  css:
    - stash-curator.css

settings:
  profilingEnabled:
    displayName: Enable profiling
    description: Record recent Curator operation timings for the Profiling page.
    type: BOOLEAN
  pprofEnabled:
    displayName: Capture CPU profiles
    description: Write a Go CPU and heap profile per operation into the sidecar's profiles directory, browsable and downloadable from the Profiling page. Analyze with go tool pprof. Off by default; keep off unless investigating performance.
    type: BOOLEAN
  databasePath:
    displayName: Sidecar database path
    description: Leave empty to store data in the plugin's data directory.
    type: STRING
  backupPath:
    displayName: Backup directory
    description: Leave empty to store Curator backups beside the sidecar database.
    type: STRING
  pageSize:
    displayName: Results per page
    description: Number of results shown on Curator recommendation, Similar, and Expand pages. Default 20.
    type: NUMBER
  diversityDisabled:
    displayName: Disable recommendation variety
    description: Use score-first ordering instead of avoiding repeated performers, studios, and similar content.
    type: BOOLEAN
  syncPageSize:
    displayName: Sync page size
    description: Number of Stash records fetched per synchronization request. Default 250.
    type: NUMBER
  modelUpdateEventThreshold:
    displayName: Actions before model update
    description: Rebuild after this many new playback or feedback actions. Default 5.
    type: NUMBER
  modelUpdateMaxWaitMinutes:
    displayName: Maximum model update delay (minutes)
    description: Rebuild pending preference changes after this delay. Default 30.
    type: NUMBER
  modelUpdateMinIntervalMinutes:
    displayName: Minimum model update interval (minutes)
    description: Minimum time between automatic preference-model rebuilds. Default 60.
    type: NUMBER
  autoTasksEnabled:
    displayName: Automatic background tasks
    description: Let the background worker apply pending model updates and sync recent plays on its own, without needing a browser tab open. Uses the model-update timing settings above.
    type: BOOLEAN
  scheduleExpandRefreshEnabled:
    displayName: Scheduled Expand refresh
    description: Refresh the StashDB candidate cache on a schedule so Expand and Performer Hunt stay current. Off by default.
    type: BOOLEAN
  scheduleExpandRefreshIntervalHours:
    displayName: Expand refresh interval (hours)
    description: How often the scheduled Expand refresh runs. Default 24 (daily).
    type: NUMBER
  scheduleSyncBuildEnabled:
    displayName: Scheduled sync and build
    description: Run a full sync and recommendation build on a schedule. Disabled by default.
    type: BOOLEAN
  scheduleSyncBuildIntervalHours:
    displayName: Sync and build interval (hours)
    description: How often the scheduled sync and build runs. Default 24 (daily).
    type: NUMBER
  scheduleBackupEnabled:
    displayName: Scheduled backup
    description: Create a sidecar backup on a schedule, just before a scheduled sync and build when both are due. Disabled by default.
    type: BOOLEAN
  scheduleBackupIntervalHours:
    displayName: Backup interval (hours)
    description: How often the scheduled backup runs. Default 24 (daily).
    type: NUMBER
  pruneTagName:
    displayName: Prune tag
    description: Tag applied by the Prune page. Default [Prune].
    type: STRING
  expandHorizonDays:
    displayName: Expand recent-release horizon (days)
    description: Recent-release window used by Expand. Default 90.
    type: NUMBER
  expandGender:
    displayName: External performer gender
    description: Default StashDB gender filter for Expand and Similar. Default FEMALE; leave empty for all.
    type: STRING
  expandWildcard:
    displayName: Expand popularity wildcard
    description: Include a small trending/popular sample outside preference-derived seeds.
    type: BOOLEAN
  whisparrUrl:
    displayName: Whisparr v3 URL
    description: Optional Whisparr base URL used by Expand scene actions.
    type: STRING
  whisparrApiKey:
    displayName: Whisparr API key
    description: Optional Whisparr API key. It is used only by the plugin backend.
    type: STRING
  whisparrRootFolder:
    displayName: Whisparr root folder override
    description: Optional. Leave empty to use Whisparr's first configured root folder.
    type: STRING
  whisparrQualityProfileId:
    displayName: Whisparr quality profile ID override
    description: Optional. Leave empty to use Whisparr's fallback (or first) quality profile.
    type: NUMBER
  whisparrSearchImmediately:
    displayName: Search Whisparr immediately
    description: Start a release search after adding a scene. Enabled by default.
    type: BOOLEAN
tasks:
  - name: Sync and build recommendations
    description: Use after Stash library changes. Sync changed metadata and history, then refresh recommendations.
    execArgs:
      - sync-build
  - name: Full sync and build recommendations
    description: Reconcile the complete library and publish a fresh model.
    execArgs:
      - full-sync-build
  - name: Rebuild recommendation model
    description: Force a recommendation refresh from already-synced data without contacting Stash.
    execArgs:
      - build
  - name: Apply recent Curator feedback
    description: Publish pending feedback and playback signals without blocking the Curator page.
    execArgs:
      - update-model
  - name: Sync recent plays
    description: Import plays Stash recorded since the last sync so cooldown and recovery reflect your latest viewing. Runs automatically after Curator playback.
    execArgs:
      - sync-plays
  - name: Prepare recommendation pages
    description: Warm the fast page cache for the current model without rebuilding it.
    execArgs:
      - prepare
  - name: Backup Curator data
    description: Create a timestamped sidecar backup in the plugin data directory.
    execArgs:
      - backup
  - name: Compact legacy Curator data
    description: Delete rebuildable legacy rows after validating published generation artifacts.
    execArgs:
      - compact
  - name: Vacuum compacted Curator data
    description: Explicitly reclaim file space after legacy compaction completes.
    execArgs:
      - vacuum
  - name: Refresh Expand cache
    description: Refresh promising StashDB scenes and performers without affecting library sync.
    execArgs:
      - expand-refresh
hooks:
  - name: Sync changed entity
    description: Import or remove a single entity after a Stash create, update, or delete, so the sidecar stays current without a full sync.
    triggeredBy:
      - Scene.Create.Post
      - Scene.Update.Post
      - Scene.Destroy.Post
      - Performer.Create.Post
      - Performer.Update.Post
      - Performer.Destroy.Post
      - Studio.Create.Post
      - Studio.Update.Post
      - Studio.Destroy.Post
      - Tag.Create.Post
      - Tag.Update.Post
      - Tag.Destroy.Post
    execArgs:
      - entity-sync
